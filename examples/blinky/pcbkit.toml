# Settings for this board. Each table shows its defaults; docs/project-interface.md in
# the pcbkit repository describes every key.

[board]
stem = "blinky"                # KiCad file stem: kicad/<stem>.kicad_pcb
title = "Blinky"               # shown in the title block
rev = "A"
fab_name = "Blinky_revA"       # prefix of the files for the fab house

[stackup]
layers = 2
thickness_mm = 1.6
copper_mm = 0.035              # 1 oz; 2 oz is 0.070

[route]
freerouting_passes = 40
tries = 3
stall_timeout_s = 90           # how long Freerouting may take to start routing

[stitch]
pitch_mm = 5.0
gap_limit_mm = 3.4

[fab]
profile = "pcbway"

[checks]
# kicad: ERC and DRC. outputs: the fab files describe the board. fab: PCBWay's limits,
# read from specs.py. Two fab checks have nothing to look at on this board and are
# skipped: the decoupling check (no IC to decouple) and the I2C check (no bus).
groups = ["kicad", "outputs", "fab"]
