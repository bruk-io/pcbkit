# pytest settings for a board's check run (`pcbkit check`, `pcbkit mutants`).
#
# pcbkit passes this file with -c so that no other pytest configuration reaches the
# run: not pcbkit's own, and not whatever sits above the board project. The rest of the
# command line (the rootdir, the plugin, the project and what to collect) is built in
# pcbkit/check/runner.py, once, so both commands collect exactly the same checks.
[pytest]
python_files = test_*.py
